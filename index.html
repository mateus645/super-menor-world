  var img = e.estado === "derrotado" ? sp.v : (e.dir > 0 ? sp.d : sp.e), espelhado = img === sp.e;
  var meio = espelhado ? (BOL_VIS.w - 1 - (BOL_VIS.x0 + BOL_VIS.x1) / 2) : (BOL_VIS.x0 + BOL_VIS.x1) / 2;
  var dx = Math.round(e.x + e.w / 2 - (meio + 0.5) * 3 - cxi), dy = Math.round(e.y + e.h - (BOL_VIS.y1 + 1) * 3);
  if(e.estado === "derrotado") dy = Math.round(e.y + e.h - sp.h * 3);
  if(dx < -60 || dx > LARG + 20) return;
  cx.drawImage(img, 0, 0, sp.w, sp.h, dx, dy, sp.w * 3, sp.h * 3);
  if(e.estado !== "vivo") return;

  cx.fillStyle = cf.vencido ? "#ffe3e3" : "#ffffff"; cx.fillRect(mx - lw / 2, dy + 26, lw, 11);
  cx.fillStyle = corT; cx.fillRect(mx - lw / 2, dy + 26, lw, 1); cx.fillRect(mx - lw / 2, dy + 36, lw, 1);
  texto(cf.vencido ? "VENCIDO" : "R$ 999", mx, dy + 28, corT, 1, "c", "nada");
  if(e.hp <= e.hpMax / 2 && (quadro >> 3) % 2){ cx.fillStyle = "#ff6b6b"; cx.fillRect(mx - 16, dy - 6, 3, 3); cx.fillRect(mx + 13, dy - 6, 3, 3); }
}
function desenharItens(cxi, emergindo){

function desenharParts(cxi){

function desenharClima(){

function desenhar(){
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.globalAlpha = 1;

    case "intro": desenharIntro(); break;

    case "pausa": desenharMundo(true); desenharHUD(); desenharPausa(); break;
    case "gameover": desenharGameOver(); break;
    case "fim": desenharMundo(true); escurecer(0.6); desenharFim(); break;
    case "ranking": desenharMundo(RANK.volta !== "titulo"); desenharRanking(); break;

construirFase(FASES[TREINO ? acharFase(TREINO) : 0]);
var acum = 0, ultimo = performance.now(), PASSO = 1000 / 60;
function laco(agora){
  requestAnimationFrame(laco);
  var dt = agora - ultimo; ultimo = agora; if(dt > 250) dt = 250; if(dt < 0) dt = 0;
  acum += dt;
  var n = 0;
  while(acum >= PASSO && n < 5){ passo(); acum -= PASSO; n++; }
  if(n === 5) acum = 0;

}
